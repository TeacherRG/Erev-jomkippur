<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Канун Йом Кипура 5787</title>
<meta name="description" content="Напоминания на канун Йом Кипура · Erinnerungen für Erew Jom Kippur">
<meta name="theme-color" content="#ece0c6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece0c6; --bg-soft:#f6efdf; --card:#fdf9ef; --card-warm:#faf3e3;
  --ink:#2c2418; --ink-soft:#6a5b45; --ink-faint:#9b8b72;
  --line:#ddd0b2; --line-strong:#cbb994;
  --accent:#1f5573; --accent-soft:#e4edf2;
  --gold:#a4762a; --gold-soft:#f5ead1;
  --done:#3f7a4d; --warn:#93402f; --warn-soft:#f7e8e0;
  --shadow:0 1px 2px rgba(74,58,34,.06), 0 10px 28px rgba(74,58,34,.09);
  --radius:16px;
  --heb:'Noto Serif Hebrew','Frank Ruhl Libre','David Libre','Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 60% at 15% 8%, rgba(255,251,240,.75), transparent 60%),
    radial-gradient(ellipse 70% 50% at 88% 25%, rgba(255,250,236,.55), transparent 62%),
    radial-gradient(ellipse 90% 70% at 50% 100%, rgba(203,185,148,.28), transparent 65%),
    radial-gradient(circle at 25% 60%, rgba(196,175,134,.14), transparent 40%);
  background-attachment:fixed;
}

/* ================= навигация ================= */
.nav{
  position:sticky;top:0;z-index:60;
  background:rgba(240,231,209,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line-strong);
}
.nav-top{max-width:860px;margin:0 auto;padding:11px 16px 0;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .flame{font-size:17px;line-height:1;flex:none}
.brand-txt{min-width:0}
.brand-name{font-size:13.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--ink-faint);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.share-btn{
  appearance:none;font:inherit;cursor:pointer;flex:none;
  display:inline-flex;align-items:center;gap:7px;
  background:var(--card);border:1px solid var(--line-strong);
  color:var(--ink-soft);font-size:12.5px;font-weight:600;
  padding:8px 14px;border-radius:999px;
  transition:border-color .2s ease,color .2s ease,background .2s ease;
}
.share-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.share-btn:active{transform:scale(.97)}
.share-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.switch{display:inline-flex;align-items:center;flex:none;position:relative;background:var(--card);border:1px solid var(--line-strong);border-radius:999px;padding:3px;gap:2px}
.switch button{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-faint);padding:6px 13px;border-radius:999px;transition:color .22s ease;position:relative;z-index:2}
.switch button[aria-pressed="true"]{color:#fdf9ef}
.switch-thumb{position:absolute;z-index:1;top:3px;bottom:3px;background:var(--accent);border-radius:999px;transition:transform .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 4px rgba(31,85,115,.3)}

/* --- табы --- */
.tabs{
  max-width:860px;margin:0 auto;padding:9px 16px 0;display:flex;gap:4px;position:relative;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  flex:0 0 auto;padding:10px 14px 12px;border-radius:10px 10px 0 0;
  font-size:14px;font-weight:600;color:var(--ink-faint);
  transition:color .2s ease,background .2s ease;position:relative;
}
.tab:hover{color:var(--ink-soft);background:rgba(253,249,239,.5)}
.tab[aria-selected="true"]{color:var(--accent);background:rgba(253,249,239,.85)}
.tab svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab .badge{
  font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--accent-soft);color:var(--accent);
  padding:2px 7px;border-radius:999px;line-height:1.5;
}
.tab[aria-selected="false"] .badge{background:var(--line);color:var(--ink-faint)}
.tab-ink{
  position:absolute;bottom:0;height:2.5px;border-radius:2px 2px 0 0;
  background:var(--accent);
  transition:transform .32s cubic-bezier(.4,0,.2,1),width .32s cubic-bezier(.4,0,.2,1);
}
.track{height:3px;background:var(--line)}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .45s cubic-bezier(.4,0,.2,1)}
.track.dim .fill{opacity:.25}

/* ================= страницы ================= */
.wrap{max-width:860px;margin:0 auto;padding:0 16px 90px}
.page{display:none}
.page.on{display:block;animation:in .32s cubic-bezier(.4,0,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

header.hero{padding:44px 0 26px;text-align:center}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:14px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(29px,6.6vw,44px);line-height:1.13;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
.byline{font-size:13.5px;color:var(--ink-soft);margin:0;line-height:1.7}
.byline span{display:block}
.byline .credit{color:var(--ink-faint);font-size:12.5px}
.lede{max-width:560px;margin:0 auto;font-size:14.5px;color:var(--ink-soft);line-height:1.65}

.stat{margin:26px auto 0;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.stat-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.stat-label{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.stat-num{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-num em{font-style:normal;color:var(--ink-faint);font-weight:500}
.stat-track{height:7px;background:var(--line);border-radius:999px;overflow:hidden}
.stat-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .45s cubic-bezier(.4,0,.2,1)}
.reset{margin-top:12px;appearance:none;border:0;background:transparent;color:var(--ink-faint);font:inherit;font-size:12px;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--warn)}

/* ---- секции чек-листа ---- */
section{margin-top:36px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:0 2px}
.sec-num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em;line-height:1.35}
.sec-line{flex:1;height:1px;background:var(--line-strong);min-width:12px}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;cursor:pointer;border-top:1px solid var(--line);transition:background .15s ease;user-select:none}
.item:first-child{border-top:0}
.item:hover{background:var(--card-warm)}
.item:active{background:var(--gold-soft)}
.box{flex:none;width:21px;height:21px;margin-top:1px;border:2px solid var(--line-strong);border-radius:6px;display:grid;place-items:center;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.box svg{width:12px;height:12px;stroke:#fdf9ef;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s ease .05s}
.item[data-done="1"] .box{background:var(--done);border-color:var(--done);transform:scale(1.04)}
.item[data-done="1"] .box svg{stroke-dashoffset:0}
.txt{min-width:0;flex:1;display:block}
.t{display:block;font-size:15px;font-weight:500;line-height:1.45;transition:color .2s,opacity .2s}
.d{display:block;font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
.item[data-done="1"] .t{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--line-strong)}
.item[data-done="1"] .d{opacity:.55}
.jump{
  display:inline-flex;align-items:center;gap:4px;margin-top:6px;
  font-size:12.5px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border:0;font-family:inherit;
  padding:4px 10px;border-radius:999px;cursor:pointer;
  transition:background .18s ease,transform .18s ease;
}
.jump:hover{background:#d4e4ed;transform:translateX(2px)}

.callout{margin-top:14px;background:var(--warn-soft);border:1px solid rgba(147,64,47,.25);border-radius:var(--radius);padding:16px 18px}
.callout h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--warn)}
.callout dl{margin:0;display:grid;gap:7px}
.callout .row{display:flex;gap:8px;font-size:13.5px;line-height:1.5;flex-wrap:wrap}
.callout dt{font-weight:600;color:var(--ink);flex:none}
.callout dd{margin:0;color:var(--ink-soft)}

/* ---- благословение ---- */
.scroll{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:6px 22px 22px;margin-top:8px;
  background-image:radial-gradient(ellipse 70% 40% at 80% 0%, rgba(245,234,209,.9), transparent 70%);
}
.block{border-top:1px solid var(--line);padding:18px 0}
.block:first-child{border-top:0}
.rubric{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;align-items:baseline;font-size:13px;color:var(--gold);font-weight:600}
.rubric .r-heb{font-family:var(--heb);direction:rtl;text-align:right;font-size:15px;font-weight:500;line-height:1.7}
.rubric .r-trn{font-style:italic}
.verse{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;align-items:start;margin-top:10px}
.verse:first-child{margin-top:0}
.v-heb{font-family:var(--heb);direction:rtl;text-align:right;unicode-bidi:isolate;font-size:19px;line-height:2.05;color:var(--ink);font-weight:500;order:2;padding-inline-start:28px;border-inline-start:1px solid var(--line)}
.v-trn{font-size:14.5px;line-height:1.72;color:var(--ink-soft);order:1;padding-top:3px}
.verse.lead .v-heb{font-size:22px;color:var(--accent);font-weight:600}
.verse.lead .v-trn{font-size:15px;color:var(--ink);font-weight:500}
.note .v-heb{font-size:16px;line-height:1.9;color:var(--ink-soft);font-weight:400}
.note .v-trn{font-size:13.5px;font-style:italic;color:var(--ink-faint)}

/* ---- раздел «Пост и здоровье» ---- */
.tab-med[aria-selected="true"]{color:var(--warn)}
.tab-med[aria-selected="true"]~.tab-ink,
.tabs:has(.tab-med[aria-selected="true"]) .tab-ink{background:var(--warn)}

.med-alert{
  background:var(--warn-soft);border:1.5px solid rgba(147,64,47,.4);
  border-radius:var(--radius);padding:18px 20px;margin-top:8px;
}
.med-alert-h{font-size:14.5px;font-weight:700;color:var(--warn);margin-bottom:6px}
.med-alert-d{font-size:13.5px;color:var(--ink);line-height:1.62}
.med-tr{
  margin:12px 0 0;font-size:12.5px;color:var(--ink-faint);
  line-height:1.55;text-align:center;font-style:italic;
}

.myth{
  background:var(--accent-soft);border:1.5px solid rgba(31,85,115,.32);
  border-radius:var(--radius);padding:18px 20px;margin-top:8px;
}
.myth-h{font-size:14.5px;font-weight:700;color:var(--accent);margin-bottom:6px}
.myth-d{font-size:13.5px;color:var(--ink);line-height:1.62}
.myth-d b{font-weight:700}
.myth-d .heb{font-family:var(--heb);direction:rtl;unicode-bidi:isolate;color:var(--accent);font-weight:600}
.myth+.med-alert{margin-top:12px}

.med-sec{margin-top:34px}
.med-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.med-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;min-width:180px}
.med-src{
  font-family:var(--heb);direction:rtl;unicode-bidi:isolate;
  font-size:13px;color:var(--accent);font-weight:500;flex:none;
}
.med-lead{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 14px}
.med-rule{height:1px;background:var(--line-strong);margin-bottom:16px}

.med-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.med-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:16px 18px;
}
.med-card-t{font-size:14.5px;font-weight:700;margin-bottom:7px;line-height:1.35}
.med-card-t .heb{
  font-family:var(--heb);direction:rtl;unicode-bidi:isolate;
  color:var(--accent);font-weight:600;font-size:15px;margin-inline-start:5px;
}
.med-card-d{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.med-card-d b{color:var(--ink);font-weight:600}
.med-card.big .med-card-t{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:30px;font-weight:700;color:var(--accent);margin-bottom:4px;
}

.med-quote{
  margin-top:14px;background:var(--gold-soft);
  border:1px solid rgba(164,118,42,.35);border-radius:14px;
  padding:16px 20px;font-size:14px;line-height:1.62;color:var(--ink);
  text-align:center;font-weight:500;
}
.med-quote .heb{font-family:var(--heb);direction:rtl;unicode-bidi:isolate;color:var(--gold);font-weight:600}
.med-note{margin:12px 0 0;font-size:13px;color:var(--ink-faint);line-height:1.58;font-style:italic}

.med-rows{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.med-row{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:6px 20px;padding:15px 18px;border-top:1px solid var(--line)}
.med-row:first-child{border-top:0}
.med-row-t{font-size:14px;font-weight:700;line-height:1.4}
.med-row-t .heb{font-family:var(--heb);direction:rtl;unicode-bidi:isolate;color:var(--accent);font-weight:600;display:block;font-size:14px;margin-top:2px}
.med-row-d{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.med-row-d .act{display:block;margin-top:5px;color:var(--ink);font-weight:600}

.med-steps{display:grid;gap:12px}
.med-step{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.med-step-n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.med-step-t{font-size:14.5px;font-weight:700;margin-bottom:5px}
.med-step-t .heb{font-family:var(--heb);direction:rtl;unicode-bidi:isolate;color:var(--accent);font-weight:600;margin-inline-start:5px}
.med-step-d{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.med-step-d b{color:var(--ink)}

.med-final{
  margin-top:30px;text-align:center;
  background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:28px 24px;
  background-image:radial-gradient(ellipse 70% 80% at 50% 0%, var(--gold-soft), transparent 75%);
}
.med-final p{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(20px,4.4vw,27px);line-height:1.3;font-weight:700;margin:0;color:var(--ink);
}
.med-credit{margin-top:22px;text-align:center;font-size:12.5px;color:var(--ink-faint);line-height:1.7}
.med-credit-heb{font-family:var(--heb);direction:rtl;font-size:13px;color:var(--ink-soft);margin-top:3px}
.med-credit-c{margin-top:5px;font-size:11.5px}

@media (max-width:560px){
  .med-row{grid-template-columns:1fr;gap:4px}
}

/* ---- виджет Хабада ---- */
.cl-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 18px;margin-top:8px;
  display:flex;justify-content:center;overflow-x:auto;
}
.cl-card table{margin:0 auto}
#clFrame{width:210px;max-width:100%;border:0;display:block;height:0;overflow:hidden;background:transparent}
.cl-note{
  margin-top:16px;background:var(--accent-soft);
  border:1px solid rgba(31,85,115,.22);border-radius:var(--radius);padding:17px 19px;
}
.cl-note-h{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:5px}
.cl-note-d{font-size:13.5px;color:var(--ink-soft);line-height:1.58}
.cl-btn{
  display:inline-flex;align-items:center;gap:7px;margin-top:13px;
  background:var(--accent);color:#fdf9ef;text-decoration:none;
  font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;
  transition:background .2s ease;
}
.cl-btn:hover{background:#17435c}
.cl-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cl-geo{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:4px 8px;margin-top:12px;
  font-size:13px;color:var(--ink-soft);
  background:var(--card-warm);border:1px solid var(--line);
  border-radius:999px;padding:9px 18px;width:fit-content;
  margin-left:auto;margin-right:auto;max-width:100%;
}
.cl-geo svg{width:15px;height:15px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.7}
.cl-geo-city{font-weight:700;color:var(--ink)}
.cl-geo-time{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cl-geo-sep{color:var(--ink-faint)}
.cl-geo-zone{font-size:11.5px;color:var(--ink-faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.cl-fail{
  margin:8px 0 0;background:var(--warn-soft);
  border:1px solid rgba(147,64,47,.25);border-radius:var(--radius);
  padding:16px 18px;font-size:13.5px;color:var(--warn);
  line-height:1.58;font-weight:500;
}
.cl-warn{
  margin:16px 0 0;font-size:12.5px;color:var(--ink-faint);line-height:1.6;
  text-align:center;max-width:620px;margin-left:auto;margin-right:auto;
  padding:0 8px;
}

/* ---- стих в рамке (Ве-hу рахум) ---- */
.vbox{
  margin-top:14px;text-align:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 24px 18px;
  background-image:radial-gradient(ellipse 60% 70% at 50% 0%, var(--gold-soft), transparent 72%);
}
.vbox-h{font-size:14px;font-weight:700;color:var(--gold);letter-spacing:-.005em}
.vbox-sub{font-size:12.5px;color:var(--ink-faint);margin-top:4px;line-height:1.5}
.vbox-heb{
  font-family:var(--heb);direction:rtl;unicode-bidi:isolate;white-space:pre-line;
  font-size:23px;line-height:2.1;font-weight:500;color:var(--ink);
  margin:16px auto 0;max-width:34ch;
}
.vbox-tr{
  font-size:14px;font-style:italic;color:var(--accent);font-weight:500;
  margin-top:12px;line-height:1.6;
  padding-top:12px;border-top:1px solid var(--line);
}
.vbox-trn{font-size:14px;color:var(--ink-soft);margin-top:9px;line-height:1.62}
.vbox-src{font-size:11.5px;color:var(--ink-faint);margin-top:12px;letter-spacing:.04em}

/* ---- заголовок внутри свитка ---- */
.bhead{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;align-items:baseline;margin-bottom:4px}
.bhead .h-trn{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.005em}
.bhead .h-heb{font-family:var(--heb);direction:rtl;text-align:right;font-size:18px;font-weight:600;color:var(--accent);line-height:1.6}
.v-heb.pre,.v-trn.pre{white-space:pre-line}
.amount{
  display:inline-block;margin-top:8px;
  background:var(--gold-soft);border:1px solid rgba(164,118,42,.3);
  color:var(--gold);font-weight:700;font-size:13.5px;
  padding:5px 12px;border-radius:999px;
}

/* ---- донат ---- */
.donate{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  margin-top:20px;text-decoration:none;color:inherit;
  background:linear-gradient(135deg, var(--gold-soft), var(--card));
  border:1px solid rgba(164,118,42,.34);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 22px;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.donate:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 2px 4px rgba(74,58,34,.08),0 14px 32px rgba(74,58,34,.13)}
.donate-icon{font-size:26px;line-height:1;flex:none}
.donate-txt{flex:1;min-width:190px;display:block}
.donate-h{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
.donate-d{display:block;font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.donate-btn{
  flex:none;display:inline-flex;align-items:center;gap:8px;
  background:var(--gold);color:#fdf9ef;
  font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;
  transition:background .2s ease;
}
.donate:hover .donate-btn{background:#8f6524}
.donate-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- переход между страницами ---- */
.pager{
  margin-top:30px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
}
.pager.two{justify-content:space-between}
.pager button{
  display:inline-flex;align-items:center;gap:9px;
  appearance:none;font:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line-strong);
  color:var(--ink);font-size:14px;font-weight:600;
  padding:13px 22px;border-radius:999px;box-shadow:var(--shadow);
  transition:border-color .2s ease,transform .2s ease,color .2s ease;
}
.pager button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.pager svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

footer{margin-top:44px;text-align:center;padding:30px 16px 0;border-top:1px solid var(--line-strong)}
.blessing{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,5vw,30px);font-weight:700;color:var(--gold);margin:0 0 8px}
.foot-note{font-size:12.5px;color:var(--ink-faint);margin:0}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120%);background:var(--ink);color:var(--card);padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:100;box-shadow:0 8px 30px rgba(44,36,24,.3);transition:transform .35s cubic-bezier(.4,0,.2,1);pointer-events:none}
.toast.show{transform:translate(-50%,0)}

@media (max-width:640px){
  .verse,.rubric,.bhead{grid-template-columns:1fr;gap:8px}
  .bhead .h-trn{order:2}
  .bhead .h-heb{order:1}
  .donate{padding:18px;gap:13px}
  .donate-btn{width:100%;justify-content:center}
  .pager.two{gap:8px}
  .pager.two button{flex:1;justify-content:center;padding:13px 14px;font-size:13px}
  .v-heb{order:1;padding-inline-start:0;border-inline-start:0;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .v-trn{order:2;padding-top:0}
  .rubric .r-trn{order:2}
  .rubric .r-heb{order:1}
  .scroll{padding:6px 16px 18px}
}
@media (max-width:640px){

@media print{

  body{background:#fff}

}

  g("ledeT").textContent=u.ledeT;
  g("noteTH").textContent=u.noteTH;
  g("noteTD").textContent=u.noteTD2;
  g("clGeoLabel").textContent=u.geoLabel;
  paintGeo();
  g("noteTBtnLabel").textContent=u.noteTBtn;
  g("warnT").textContent=u.warnT;
  g("clFail").textContent=u.clFail;
  g("eyebrowK").textContent=u.eyebrowK;
  g("titleK").textContent=u.titleK;
  g("ledeK").textContent=u.ledeK;
  g("donateH").textContent=u.donateH;
  g("donateD").textContent=u.donateD;
  g("donateB").textContent=u.donateB;
  g("eyebrow2").textContent=u.eyebrow2;
  g("title2").textContent=u.title2;
  g("lede2").textContent=u.lede2;
  g("blessing").textContent=u.blessing;
  g("footNote").textContent=u.footNote;
  g("shareLabel").textContent=u.share;
  g("shareBtn").setAttribute("aria-label",u.share);

  // подписи кнопок «вперёд / назад» на каждой странице
  const P={list:{next:u.pagerT}, times:{back:u.tabList, next:u.pagerK},
           kaporot:{back:u.pagerT, next:u.pagerNext},
           bracha:{back:u.pagerK, next:u.pagerF},
           fast:{back:u.pagerNext, next:u.pagerD}, kids:{back:u.pagerF}};
  document.querySelectorAll(".page").forEach(pg=>{
    const key=pg.id.replace("page-","");
    const n=pg.querySelector(".p-next"), b=pg.querySelector(".p-back");
    if(n&&P[key].next)n.textContent=P[key].next;
    if(b&&P[key].back)b.textContent=P[key].back;
  });
  document.title=docTitle();
}
function docTitle(){
  const u=UI[lang];
  return page==="list"?u.docList : page==="times"?u.docT : page==="kaporot"?u.docK
       : page==="fast"?u.docF : page==="kids"?u.docD : u.docBracha;
}

function renderList(){
  let h="";
  LIST.forEach((sec,i)=>{
    h+='<section><div class="sec-head"><span class="sec-num">'+(i+1)+'</span><h2>'
      + esc(sec.h[lang])+'</h2><span class="sec-line"></span></div><div class="list">';
    sec.items.forEach(it=>{
      const dn=done.has(it.id)?"1":"0";
      h+='<div class="item" data-id="'+it.id+'" data-done="'+dn+'" role="checkbox" tabindex="0" aria-checked="'+(dn==="1")+'">'
       + '<span class="box">'+CHECK+'</span><span class="txt"><span class="t">'+esc(it.t[lang])+'</span>'
       + (it.d?'<span class="d">'+esc(it.d[lang])+'</span>':'')
       + (it.jump?'<button class="jump" type="button" data-go="'+(it.to||"bracha")+'">'+esc(it.jump[lang])+' →</button>':'')
       + '</span></div>';
    });
    h+='</div>';
    if(sec.callout){
      h+='<div class="callout"><h3>'+esc(sec.callout.h[lang])+'</h3><dl>';
      sec.callout.rows.forEach(r=>{h+='<div class="row"><dt>'+esc(r.dt[lang])+'</dt><dd>'+esc(r.dd[lang])+'</dd></div>'});
      h+='</dl></div>';
    }
    if(sec.versebox){
      const v=sec.versebox;
      h+='<div class="vbox">'
       + '<div class="vbox-h">'+esc(v.h[lang])+'</div>'
       + '<div class="vbox-sub">'+esc(v.sub[lang])+'</div>'
       + '<div class="vbox-heb" lang="he" dir="rtl">'+esc(v.heb)+'</div>'
       + '<div class="vbox-tr">'+esc(v.tr[lang])+'</div>'
       + '<div class="vbox-trn">'+esc(v.trn[lang])+'</div>'
       + '<div class="vbox-src">'+esc(v.src[lang])+'</div>'
       + '</div>';
    }
    h+='</section>';
  });
  g("listContent").innerHTML=h;
}

function renderScroll(data,target){
  let h='<div class="scroll">';
  data.forEach(b=>{
    h+='<div class="block">';
    if(b.head){
      h+='<div class="bhead"><span class="h-trn">'+esc(b.head.trn[lang])+'</span>'
       + '<span class="h-heb" lang="he" dir="rtl">'+esc(b.head.heb)+'</span></div>';
    }
    if(b.rubric){
      h+='<div class="rubric"><span class="r-trn">'+esc(b.rubric.trn[lang])+'</span>'
       + '<span class="r-heb" lang="he" dir="rtl">'+esc(b.rubric.heb)+'</span></div>';
    }
    b.verses.forEach(v=>{
      h+='<div class="verse '+v.cls+'"><div class="v-trn">'+esc(v.trn[lang]).replace(/\n/g," ")+'</div>'
       + '<div class="v-heb'+(v.pre?" pre":"")+'" lang="he" dir="rtl">'+esc(v.heb)+'</div></div>';
    });
    h+='</div>';
  });
  g(target).innerHTML=h+'</div>';
}

function renderSections(data,target,finalTxt){
  let h="";
  data.forEach(s=>{
    h+='<section class="med-sec"><div class="med-head"><h2>'+esc(s.h[lang])+'</h2>'
     + (s.src?'<span class="med-src" lang="he" dir="rtl">'+esc(s.src)+'</span>':'')
     + '</div><div class="med-rule"></div>';
    if(s.quoteTop) h+='<div class="med-quote">'+s.quoteTop[lang]+'</div>';
    if(s.cards){
      h+='<div class="med-grid">';
      s.cards.forEach(c=>{
        h+='<div class="med-card'+(c.big?' big':'')+'"><div class="med-card-t">'+esc(c.t[lang])
         + (c.heb?' <span class="heb" lang="he" dir="rtl">'+esc(c.heb)+'</span>':'')
         + '</div><div class="med-card-d">'+c.d[lang]+'</div></div>';
      });
      h+='</div>';
    }
    if(s.rows){
      h+='<div class="med-rows">';
      s.rows.forEach(r=>{
        h+='<div class="med-row"><div class="med-row-t">'+esc(r.t[lang])
         + (r.heb?'<span class="heb" lang="he" dir="rtl">'+esc(r.heb)+'</span>':'')
         + '</div><div class="med-row-d">'+(r.d[lang]||"")
         + '<span class="act">'+r.a[lang]+'</span></div></div>';
      });
      h+='</div>';
    }
    if(s.steps){
      h+='<div class="med-steps">';
      s.steps.forEach((st,i)=>{
        h+='<div class="med-step"><span class="med-step-n">'+(i+1)+'</span><div><div class="med-step-t">'
         + esc(st.t[lang])+(st.heb?' <span class="heb" lang="he" dir="rtl">'+esc(st.heb)+'</span>':'')
         + '</div><div class="med-step-d">'+st.d[lang]+'</div></div></div>';
      });
      h+='</div>';
    }
    if(s.quote) h+='<div class="med-quote">'+s.quote[lang]+'</div>';
    if(s.note)  h+='<p class="med-note">'+s.note[lang]+'</p>';
    h+='</section>';
  });
  if(finalTxt) h+='<div class="med-final"><p>'+esc(finalTxt)+'</p></div>';
  g(target).innerHTML=h;
}

function render(){
  renderChrome();renderList();
  renderSections(FAST,"fastContent",UI[lang].finalF);
  renderSections(KIDS,"kidsContent",null);
  renderScroll(KAPOROT,"kaporotContent");
  renderScroll(BRACHA,"brachaContent");
  updateStats();moveThumb();moveInk();
}

/* ---------- прогресс ---------- */
function total(){return LIST.reduce((n,s)=>n+s.items.length,0)}
function updateStats(){
  const u=UI[lang],tot=total(),n=done.size,pct=tot?Math.round(n/tot*100):0;
  g("statNum").innerHTML=n+' <em>'+u.of+'</em> '+tot+' &nbsp;· '+pct+'%';
  g("statFill").style.width=pct+"%";
  g("barFill").style.width=pct+"%";
  g("tabBadge").textContent=n+"/"+tot;
}
function toggle(el){
  const id=el.dataset.id;
  if(done.has(id))done.delete(id);else done.add(id);
  const is=done.has(id);
  el.dataset.done=is?"1":"0";
  el.setAttribute("aria-checked",is);
  save(K_DONE,JSON.stringify([...done]));
  updateStats();
}
g("listContent").addEventListener("click",e=>{
  if(e.target.closest(".jump"))return;
  const it=e.target.closest(".item"); if(it)toggle(it);
});
g("listContent").addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="Enter"){
    if(e.target.closest(".jump"))return;
    const it=e.target.closest(".item"); if(it){e.preventDefault();toggle(it)}
  }
});

/* ---------- страницы ---------- */
const tabs=g("tabs"), ink=g("tabInk");
function moveInk(){
  const a=tabs.querySelector('.tab[aria-selected="true"]'); if(!a)return;
  ink.style.width=a.offsetWidth+"px";
  ink.style.transform="translateX("+a.offsetLeft+"px)";
  // если полоса вкладок прокручивается (узкий экран) — подтянуть активную в зону видимости
  if(tabs.scrollWidth>tabs.clientWidth+1){
    const l=a.offsetLeft, r=l+a.offsetWidth, s=tabs.scrollLeft, w=tabs.clientWidth;
    if(l<s+12) tabs.scrollLeft=Math.max(0,l-12);
    else if(r>s+w-12) tabs.scrollLeft=r-w+12;
  }
}
const PAGES=["list","times","kaporot","bracha","fast","kids"];
function go(p,push){
  if(PAGES.indexOf(p)<0)p="list";
  page=p;
  tabs.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.page===p));
  PAGES.forEach(k=>g("page-"+k).classList.toggle("on",k===p));
  g("track").classList.toggle("dim",p!=="list");
  document.title=docTitle();
  moveInk();
  if(push!==false&&location.hash.slice(2)!==p)location.hash="#/"+p;
  window.scrollTo({top:0,behavior:push===false?"auto":"smooth"});
}
tabs.addEventListener("click",e=>{const t=e.target.closest(".tab");if(t)go(t.dataset.page)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
window.addEventListener("hashchange",()=>go(location.hash.slice(2)||"list",false));
window.addEventListener("resize",()=>{moveInk();moveThumb()});

/* ---------- язык ---------- */
const sw=g("langSwitch"), thumb=g("thumb");
function moveThumb(){
  const a=sw.querySelector('button[aria-pressed="true"]'); if(!a)return;
  thumb.style.width=a.offsetWidth+"px";
  thumb.style.transform="translateX("+(a.offsetLeft-3)+"px)";
}
sw.addEventListener("click",e=>{
  const b=e.target.closest("button[data-lang]");
  if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;
  sw.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===lang));
  save(K_LANG,lang);
  render();
});

/* ---------- сброс ---------- */
const toastEl=g("toast");let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),2200)}
g("resetBtn").addEventListener("click",()=>{done.clear();save(K_DONE,"[]");renderList();updateStats();toast(UI[lang].toastReset)});

/* ---------- поделиться ---------- */
g("shareBtn").addEventListener("click",async()=>{
  const u=UI[lang], url=location.href;
  if(navigator.share){
    try{ await navigator.share({title:u.shareTitle,text:u.shareText,url}); return; }
    catch(e){ if(e&&e.name==="AbortError")return; }
  }
  try{
    await navigator.clipboard.writeText(url);
    toast(u.toastCopied); return;
  }catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=url; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast(u.toastCopied);
  }catch(e){ prompt(u.share, url); }
});

/* ---------- что определило само устройство ---------- */
function paintGeo(){
  const box=g("clGeo"); if(!box)return;
  let tz="";
  try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""; }catch(e){}
  if(!tz){ box.hidden=true; return; }           // не определилось — не показываем ничего
  const city=(tz.indexOf("/")>0 ? tz.split("/").pop() : tz).replace(/_/g," ");
  let now="";
  try{ now=new Date().toLocaleTimeString(UI[lang].locale,{hour:"2-digit",minute:"2-digit",timeZone:tz}); }
  catch(e){ now=new Date().toLocaleTimeString(UI[lang].locale,{hour:"2-digit",minute:"2-digit"}); }
  g("clGeoCity").textContent=city;
  g("clGeoTime").textContent=now;
  g("clGeoZone").textContent=tz;
  box.hidden=false;
}
setInterval(paintGeo,30000);

/* ---------- виджет Хабада: грузим в iframe, изолированно ----------
   Их скрипт — блокирующий и сторонний. Оставленный в теле документа, он
   при медленном или недоступном chabad.org останавливает разбор страницы
   и она остаётся пустой. В iframe он выполняется сам по себе и навредить
   основному документу не может. Код внутри — дословный.                */
function initChabad(){
  const tpl=g("clTpl"), fr=g("clFrame"), card=g("clCard"), fail=g("clFail");
  if(!tpl||!fr||!card||!fail)return;
  let done=false;
  const giveUp=()=>{ if(!done){ card.hidden=true; fail.hidden=false; } };

  try{
    const d=fr.contentDocument||(fr.contentWindow&&fr.contentWindow.document);
    if(!d){ giveUp(); return; }
    d.open();
    d.write('<!DOCTYPE html><html><head><meta charset="utf-8">'
          + '<base target="_blank"><style>html,body{margin:0;padding:0;background:transparent}'
          + 'body{display:flex;justify-content:center}</style></head><body>'
          + tpl.innerHTML + '</body></html>');
    d.close();
  }catch(e){ giveUp(); return; }

  // ждём, пока их скрипт впишет настоящее время (7:02 / 19:02)
  let tries=0;
  const poll=setInterval(()=>{
    tries++;
    let txt="",hgt=0;
    try{
      const d=fr.contentDocument;
      txt=(d&&d.body&&d.body.innerText)||"";
      hgt=(d&&d.body&&d.body.scrollHeight)||0;
    }catch(e){}
    if(/\d{1,2}:\d{2}/.test(txt)){
      done=true; clearInterval(poll);
      fr.style.height=Math.max(hgt,40)+"px";
      card.hidden=false; fail.hidden=true;
    }else if(tries>=24){            // ~8 секунд
      clearInterval(poll); giveUp();
    }
  },350);
}
/* запускаем только после полной загрузки страницы — так виджет
   не задерживает ни отрисовку, ни событие load */
function startChabad(){ setTimeout(initChabad,60); }
if(document.readyState==="complete") startChabad();
else window.addEventListener("load",startChabad);

/* ---------- старт ---------- */
(function init(){
  const sl=load(K_LANG);
  if(sl==="de"||sl==="ru")lang=sl;
  else if((navigator.language||"").toLowerCase().startsWith("de"))lang="de";
  sw.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  try{const r=load(K_DONE);if(r)JSON.parse(r).forEach(i=>done.add(i))}catch(e){}
  render();
  go(location.hash.slice(2)||"list",false);
  setTimeout(()=>{moveThumb();moveInk()},60);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{moveThumb();moveInk()});
})();
</script>
